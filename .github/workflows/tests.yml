name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install numpy pytest
      - name: Compile all Python files
        run: python -m compileall -q src scripts tests borealis
      - name: Tests
        run: python -m pytest -q -rs
